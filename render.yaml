services:
  # PhonePay API Backend Service
  - type: web
    name: phonepay-api-backend
    runtime: docker
    plan: free
    repo: https://github.com/RAMYA2927/PhonePay-API-Backend.git
    branch: main
    region: oregon
    
    # Docker configuration
    dockerfilePath: Dockerfile
    dockerContext: .
    
    # Environment variables
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        # Set this in the Render dashboard as a secret. Must start with mongodb:// or mongodb+srv://
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: production
    
    # Health check
    healthCheckPath: /actuator/health
    
    # Auto-deploy on push
    autoDeploy: true
